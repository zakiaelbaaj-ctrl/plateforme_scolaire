<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription Étudiant</title>

  <link rel="stylesheet" href="../../css/base.css">
</head>

<body class="auth-body">

  <select id="selecteurLangue" aria-label="Langue"
          style="position:fixed;top:12px;inset-inline-end:12px;z-index:50;font-family:inherit;
                 font-size:.9rem;padding:6px 10px;border-radius:8px;border:1px solid #ccc;
                 background:#fff;cursor:pointer;width:auto;min-width:0;max-width:200px;"></select>

<div class="auth-container role-etudiant">
  
  <div class="logo-global"></div>

  <h1 data-i18n="inscription.etudiant.titre">📝 Inscription Étudiant</h1>

  <form id="registerForm">
    <div class="form-group">
      <label for="username" data-i18n="inscription.nomUtilisateurReq">Nom d'utilisateur *</label>
      <input type="text" id="username" name="username" required placeholder="jean_martin">
    </div>

    <div class="form-group">
      <label for="prenom" data-i18n="inscription.prenomReq">Prénom *</label>
      <input type="text" id="prenom" name="prenom" required placeholder="Jean">
    </div>

    <div class="form-group">
      <label for="nom" data-i18n="inscription.nomReq">Nom *</label>
      <input type="text" id="nom" name="nom" required placeholder="Martin">
    </div>
    <div class="form-group">
      <label for="email" data-i18n="inscription.emailReq">Email *</label>
      <input type="email" id="email" name="email" required placeholder="jean@test.com">
    </div>

    <div class="form-group">
      <label for="telephone" data-i18n="inscription.telephone">Téléphone</label>
      <input type="tel" id="telephone" name="telephone" placeholder="0601020304">
    </div>
    
    <div class="form-group">
      <label for="ville" data-i18n="inscription.ville">Ville</label>
      <input type="text" id="ville" name="ville" placeholder="Paris">
    </div>

    <div class="form-group">
      <label for="pays" data-i18n="inscription.pays">Pays</label>
      <input type="text" id="pays" name="pays" placeholder="France" required>
    </div>

    <div class="form-group">
      <label for="password" data-i18n="inscription.motDePasseReq">Mot de passe *</label>
      <input type="password" id="password" name="password" required placeholder="••••••">
    </div>

    <button type="submit" id="submitBtn" data-i18n="login.sInscrire">S'inscrire</button>

    <div id="errorDiv" class="error"></div>
    <div id="successDiv" class="success"></div>
  </form>

  <div class="info demo-info" style="margin-top: 15px;">
    💡 <strong>Test:</strong> username: Sasy26 | password: Demo1234!
  </div>

  <div class="link-section">
    <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>
  </div>
</div>

<script type="module" src="../../js/auth/register_etudiant.js"></script>

  <script type="module">
    import { initI18n, definirLangue, LANGUES } from "/js/core/i18n.js";
    (async () => {
      const langue = await initI18n();
      const select = document.getElementById("selecteurLangue");
      if (!select) return;
      LANGUES.forEach((l) => {
        const opt = document.createElement("option");
        opt.value = l.code;
        opt.textContent = l.nomNatif;
        if (l.code === langue.code) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", () => definirLangue(select.value));
    })();
  </script>

</body>
</html>
