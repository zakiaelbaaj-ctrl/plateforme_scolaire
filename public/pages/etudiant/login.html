<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Étudiant</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-iphone.png">
  <link rel="apple-touch-icon" href="/assets/icons/icones.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body class="auth-body">
  <div class="auth-container role-etudiant">

    <div class="logo-global"></div>

    <h1>🎓 Connexion Étudiant</h1>
    <p class="subtitle">Accédez à votre espace de travail collaboratif</p>

    <form id="loginEtudiantForm">

      <div class="form-group">
        <label for="username">Nom d'utilisateur ou Email</label>
        <input type="text" id="username" name="username" required
               autocomplete="username"
               placeholder="nom.prenom ou email@example.com">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password"
               placeholder="••••••••">
      </div>

      <button type="submit" id="submitBtn">Se connecter</button>

      <div id="loadingDiv" class="loading"></div>
      <div id="errorDiv"   class="error"></div>
      <div id="successDiv" class="success"></div>
       <div class="link-section" style="margin-top: 10px; text-align: center;">
  <a href="/forgot_password.html">Mot de passe oublié ?</a>
</div>
    </form>

    <div class="link-section">
      Pas encore inscrit ? <a href="/pages/etudiant/register.html" id="registerLink">S'inscrire</a>
    </div>
    <div class="link-section" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 15px;">
      Vous êtes élève ? <a href="/pages/eleve/login.html">Connexion élève</a>
    </div>


    <div class="link-section" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 15px;">
      Vous êtes professeur ? <a href="/pages/professeur/login.html">Connexion professeur</a>
    </div>

  </div>

  <script type="module" src="../../js/auth/login_etudiant.js"></script>
</body>
</html>
