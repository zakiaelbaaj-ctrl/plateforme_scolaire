<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Professeur</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="apple-touch-startup-image" href="/assets/splash/splash-iphone.png">
<link rel="apple-touch-icon" href="/assets/icons/icones.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body class="auth-body">

  <div class="container role-professeur">

    <div class="logo-global"></div>

    <h1>🧑‍🏫 Connexion Professeur</h1>
    <p class="subtitle">Accédez à votre espace de cours</p>

    <form id="loginProfForm">

      <div class="form-group">
        <label for="username">Nom d'utilisateur ou Email</label>
        <input type="text" id="username" name="username" required
               autocomplete="username"
               placeholder="jean.dupont ou jean@example.com">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password"
               placeholder="••••••••">
      </div>

      <button type="submit" class="professeur-btn" id="submitBtn">Se connecter</button>

      <div id="loadingDiv" class="loading"></div>
      <div id="errorDiv"   class="error"></div>
      <div id="successDiv" class="success"></div>
      <div class="link-section" style="margin-top: 10px; text-align: center;">
  <a href="/forgot_password.html">Mot de passe oublié ?</a>
</div>

    </form>

    <div class="link-section">
      Pas encore inscrit ? <a href="register.html">S'inscrire</a>
    </div>

    <div class="link-section" style="margin-top: 10px; border-top: 1px solid #ddd; padding-top: 15px;">
      Vous êtes élève ? <a href="../eleve/login.html">Connexion élève</a>
    </div>

  </div>

  <script type="module" src="../../js/auth/login_professeur.js"></script>

</body>
</html>
